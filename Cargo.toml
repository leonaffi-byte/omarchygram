[package]
name = "omarchygram"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
chrono = "0.4.45"
dirs = "6.0.0"
grammers-client = "0.10.0"
grammers-session = "0.10.0"
grammers-tl-types = "0.10.0"
gtk4 = { version = "0.11.4", features = ["v4_12"] }
image = "0.25.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.4"
