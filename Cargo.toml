[package]
name = "omarchygram"
version = "0.1.8"
edition = "2024"
repository = "https://github.com/leonaffi-byte/omarchygram"

[features]
# Voice/video calls via the vendored ntgcalls static lib (LGPL-3; see bin/fetch-ntgcalls).
# Included by default; --no-default-features is an explicit build without calls.
default = ["calls"]
calls = ["dep:ntgcalls"]

[[example]]
name = "native_call_probe"
required-features = ["calls"]

# 0.10.0 returns before its final asynchronous file write completes. Keep the
# upstream downloader (including parallel large transfers) with two flushes.
[patch.crates-io]
grammers-client = { path = "vendor/grammers-client" }
# Reuse the desktop's ABI-compatible GLib and FFmpeg libraries. Keep the
# pinned call engine/WebRTC archive, without bundling duplicate system code.
ntgcalls-sys = { path = "vendor/ntgcalls-sys" }

# Wave 8A optimization (specs/spec-wave8.md): smaller + faster release binary.
# codegen-units = 1 + opt-level = 3 optimize the whole crate as a unit; strip
# ships without symbols. Measured on this tree: 73.9 MB default → 60.8 MB.
# NOT set, and why (both were tried and reverted 2026-09-04):
#   - lto: the thin-LTO link over the vendored 128 MB ntgcalls/WebRTC static lib
#     is RAM-heavy and OOM-killed the linker repeatedly; net size win was ~1.5 MB
#     (the binary is dominated by that prebuilt blob, which LTO cannot touch).
#   - panic = "abort": in a release build it made GTK abort at startup with a
#     GObject bind_property CRITICAL (fatal under the gate's G_DEBUG); the debug
#     build and the default-profile release build are both clean. Not worth the
#     tiny unwind-table saving. The app still treats panics as fatal by design.
[profile.release]
codegen-units = 1
strip = "symbols"
opt-level = 3

[dependencies]
libc = "0.2"
ntgcalls = { version = "=3.0.0-rc01", optional = true }
async-channel = "2.5.0"
# Keep the minimal clock backend; serde preserves timestamps in the bounded
# local history cache without losing formatting or typed message payloads.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dirs = "6.0.0"
flate2 = "1"
grammers-client = "0.10.0"
# GStreamer audio and explicitly owned video pipelines (GTK paintable adapter).
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
grammers-session = "0.10.0"
grammers-tl-types = "0.10.0"
gtk4 = { version = "0.11.4", features = ["v4_12"] }
# Wave 8C: the `image` crate is used only to decode webp (stickers) + png (OSM
# tiles) and encode png (stickers, maps); photos/avatars go through GdkPixbuf,
# not this crate. Drop the ~10 unused codecs (gif/tiff/bmp/ico/tga/dds/exr/…);
# JPEGs continue to decode through GdkPixbuf/GStreamer; no duplicate JPEG codec.
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Wave 6D animated (.tgs) stickers: ThorVG vendored, software rasterizer only
# (decided 2026-09-03 after the renderer spike; see specs/spec-wave6.md §5.1).
thorvg = { version = "=0.5.1", default-features = false, features = ["vendored", "std", "lottie", "threads"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util"] }
toml = "1.1.4"
