[project]
name = "omarchygram"
version = "0.1.0"
description = "A Telegram client that dresses like your Omarchy theme"
requires-python = ">=3.12"
# PyGObject comes from the system (pacman python-gobject) via --system-site-packages;
# pip-installing it would need C build deps for no gain.
dependencies = [
    "telethon>=1.36",
    "pillow>=10",  # webp sticker -> png for GdkPixbuf
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
omarchygram = "omarchygram.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omarchygram*"]

[tool.setuptools.package-data]
"omarchygram.theme" = ["style.css"]
